<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>世界の天気</title>
    <link rel="stylesheet" href="project.css">
    <script src="weather.js" defer></script>
    <script src="project.js" defer></script>
  </head>
  <body>

    <h1>世界の天気</h1>

    <div class="search-form">
      <label for="city-select">都市名：</label>
      <select id="city-select">
        <option value="1816670">Beijing 北京（中華人民共和国）</option>
        <option value="1850147">Tokyo 東京（日本）</option>
        <option value="2147714">Sydney シドニー（オーストラリア）</option>
        <option value="2643743">London ロンドン（イギリス）</option>
        <option value="5128581">New York ニューヨーク（アメリカ合衆国）</option>
      </select>
      <button id="search-btn">検索</button>
    </div>

    <section id="result-section" hidden>
      <h2>以下の地域の天候に関する情報を検索して表示します</h2>
      <ul id="result-list"></ul>
      <figure>
        <img id="weather-icon" src="" alt="">
      </figure>
    </section>

  </body>
</html>
